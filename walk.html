<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Walk — Curb Claim</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; background: #f3f0e8; }
    #map { position: fixed; inset: 7.2rem 0 4.6rem 0; }
    .map-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 500; background: #fff; border-bottom: 1px solid #d5ddd5; padding: 0.7rem 0.9rem; }
    .map-bar h1 { margin: 0; font-size: 1.15rem; }
    .towns { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.45rem; }
    .towns button { border: 1px solid #d5ddd5; background: #fff; border-radius: 999px; padding: 0.28rem 0.7rem; font: inherit; font-weight: 700; cursor: pointer; }
    .towns button.on { background: #146348; color: #fff; border-color: #146348; }
    .map-dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 500; background: #fff; border-top: 1px solid #d5ddd5; padding: 0.65rem 0.9rem; display: flex; gap: 0.5rem; align-items: center; }
    .map-dock .msg { flex: 1; font-size: 0.9rem; color: #5b645b; }
    .key { position: fixed; right: 0.7rem; bottom: 5.4rem; z-index: 500; background: #fff; border-radius: 10px; padding: 0.45rem 0.6rem; font-size: 0.78rem; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
    .sw { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 2px; margin-right: 0.3rem; }
    .sw.open { background: #8fb9a6; } .sw.take { background: #c45c2a; } .sw.pick { background: #1a7a58; }
    .primary { background: #1a7a58; color: #fff; border: 0; border-radius: 12px; padding: 0.7rem 0.85rem; font: inherit; font-weight: 800; }
    .primary:disabled { opacity: 0.45; }
    .text-btn { background: none; border: 0; color: #146348; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="map-bar"><h1>Walk · Curb Claim</h1><div class="towns" id="towns"></div></div>
  <div id="map"></div>
  <div class="key"><div><span class="sw open"></span>Open</div><div><span class="sw pick"></span>Selected</div><div><span class="sw take"></span>Picked up — skip</div></div>
  <div class="map-dock">
    <p class="msg" id="msg">Tap streets or Draw box, then I picked these up.</p>
    <button type="button" class="text-btn" id="drawBtn">Draw box</button>
    <button type="button" class="primary" id="collectBtn" disabled>I picked these up</button>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="walk.js"></script>
</body>
</html>
